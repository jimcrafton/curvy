<title>curvy ribbon logo</title>
<!-- One continuous ribbon: an open C whose amber face turns over at the bottom (it narrows to an edge, then widens again as the dark underside) and sweeps out to
     the right. Generated from a centre line, a twist angle along it and two colour ramps; the width at each point is cos(twist), so the flip is a real fold.
     Graphite and blue undersides. -->
